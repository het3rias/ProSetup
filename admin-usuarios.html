<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Administrar Usuarios</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-title">ProSetup Admin</div>
            <nav>
                <a href="admin-home.html" data-pagina="home">🏠 Dashboard</a>
                <a href="admin-productos.html" data-pagina="productos">📦 Productos</a>
                <a href="admin-usuarios.html" data-pagina="usuarios" id="admin-nav-usuarios">👤 Usuarios</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="index.html">🏬 Ver tienda</a>
                <a href="#" id="link-logout-admin">🚪 Cerrar sesión</a>
            </div>
        </aside>

        <div class="admin-content">
            <header class="admin-topbar">
                <h1 class="h3 mb-0">Administrar Usuarios</h1>
                <span class="badge bg-primary badge-rol">Rol: <span id="admin-rol-badge"></span> · <span id="admin-nombre-usuario"></span></span>
            </header>

            <main>
                <div class="row">
                    <!-- Formulario nuevo/editar usuario -->
                    <section class="col-lg-5 mb-4">
                        <div class="card p-3">
                            <h2 class="h5" id="titulo-formulario-usuario">Nuevo Usuario</h2>
                            <p class="text-muted small d-none" id="aviso-password-opcional">Deja la contraseña en blanco si no quieres cambiarla.</p>

                            <form id="form-admin-usuario" novalidate>
                                <input type="hidden" id="admin-u-email-original">

                                <div class="mb-2">
                                    <label for="admin-u-run" class="form-label">RUN</label>
                                    <input type="text" class="form-control" id="admin-u-run" maxlength="9" placeholder="Sin puntos ni guion, ej: 19011022K">
                                    <div class="error-mensaje" id="error-u-run"></div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-nombre" class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="admin-u-nombre" maxlength="50">
                                        <div class="error-mensaje" id="error-u-nombre"></div>
                                    </div>
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-apellidos" class="form-label">Apellidos</label>
                                        <input type="text" class="form-control" id="admin-u-apellidos" maxlength="100">
                                        <div class="error-mensaje" id="error-u-apellidos"></div>
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-u-email" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="admin-u-email" maxlength="100">
                                    <div class="error-mensaje" id="error-u-email"></div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-password" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="admin-u-password" minlength="4" maxlength="10">
                                        <div class="error-mensaje" id="error-u-password"></div>
                                    </div>
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-confirmar" class="form-label">Confirmar</label>
                                        <input type="password" class="form-control" id="admin-u-confirmar" minlength="4" maxlength="10">
                                        <div class="error-mensaje" id="error-u-confirmar"></div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-telefono" class="form-label">Teléfono (opcional)</label>
                                        <input type="tel" class="form-control" id="admin-u-telefono">
                                    </div>
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-fecha-nacimiento" class="form-label">Fecha nacimiento (opcional)</label>
                                        <input type="date" class="form-control" id="admin-u-fecha-nacimiento">
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-u-tipo" class="form-label">Tipo de usuario</label>
                                    <select class="form-select" id="admin-u-tipo">
                                        <option value="Cliente">Cliente</option>
                                        <option value="Vendedor">Vendedor</option>
                                        <option value="Administrador">Administrador</option>
                                    </select>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-region" class="form-label">Región</label>
                                        <select class="form-select" id="admin-u-region">
                                            <option value="">-- Seleccione la región --</option>
                                        </select>
                                        <div class="error-mensaje" id="error-u-region"></div>
                                    </div>
                                    <div class="col-6 mb-2">
                                        <label for="admin-u-comuna" class="form-label">Comuna</label>
                                        <select class="form-select" id="admin-u-comuna">
                                            <option value="">-- Seleccione la comuna --</option>
                                        </select>
                                        <div class="error-mensaje" id="error-u-comuna"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="admin-u-direccion" class="form-label">Dirección</label>
                                    <input type="text" class="form-control" id="admin-u-direccion" maxlength="300">
                                    <div class="error-mensaje" id="error-u-direccion"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Guardar</button>
                                <button type="button" class="btn btn-outline-secondary w-100 mt-2" id="btn-cancelar-edicion-usuario">Cancelar</button>
                            </form>
                        </div>
                    </section>

                    <!-- Listado de usuarios -->
                    <section class="col-lg-7">
                        <div class="table-responsive">
                            <table class="table table-bordered bg-white align-middle">
                                <thead>
                                    <tr>
                                        <th>RUN</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Tipo</th>
                                        <th>Región / Comuna</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-usuarios"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Mostrar Usuario -->
    <div class="modal fade" id="modal-usuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle del usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-usuario-contenido"></div>
            </div>
        </div>
    </div>

    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/regiones.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
