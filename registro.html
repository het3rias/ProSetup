<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Crear Cuenta</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ProSetup</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div id="zona-invitado" class="me-3">
                    <a href="login.html" class="text-white me-2">Iniciar Sesión</a>
                    <a href="registro.html" class="text-white">Registro</a>
                </div>
                <div id="zona-usuario" class="d-none text-white me-3">
                    Hola, <strong id="nombre-usuario"></strong> ·
                    <a href="admin-home.html" id="link-admin" class="text-white d-none">Admin</a>
                    <a href="#" id="link-logout" class="text-white">Cerrar sesión</a>
                </div>
                <a href="carrito.html" class="btn-cart">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="mx-auto" style="max-width: 640px;">
            <div class="card shadow p-4">
                <h1 class="text-center mb-1 h2">Crear Cuenta</h1>
                <p class="text-center text-muted mb-4">Registro de usuario (queda como Cliente)</p>

                <form id="form-registro" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="reg-run" class="form-label">RUN</label>
                            <input type="text" class="form-control" id="reg-run" maxlength="9" placeholder="Sin puntos ni guion, ej: 19011022K">
                            <div class="error-mensaje" id="error-reg-run"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="reg-fecha-nacimiento" class="form-label">Fecha de nacimiento (opcional)</label>
                            <input type="date" class="form-control" id="reg-fecha-nacimiento">
                            <div class="error-mensaje" id="error-reg-fecha-nacimiento"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="reg-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="reg-nombre" maxlength="50">
                            <div class="error-mensaje" id="error-reg-nombre"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="reg-apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="reg-apellidos" maxlength="100">
                            <div class="error-mensaje" id="error-reg-apellidos"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="reg-email" maxlength="100" placeholder="tucorreo@duoc.cl">
                        <div class="form-text">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com.</div>
                        <div class="error-mensaje" id="error-reg-email"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="reg-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="reg-password" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres">
                            <div class="error-mensaje" id="error-reg-password"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="reg-confirmar" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="reg-confirmar" minlength="4" maxlength="10">
                            <div class="error-mensaje" id="error-reg-confirmar"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-telefono" class="form-label">Teléfono (opcional)</label>
                        <input type="tel" class="form-control" id="reg-telefono" placeholder="+56 9 1234 5678">
                        <div class="error-mensaje" id="error-reg-telefono"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="reg-region" class="form-label">Región</label>
                            <select class="form-select" id="reg-region">
                                <option value="">-- Seleccione la región --</option>
                            </select>
                            <div class="error-mensaje" id="error-reg-region"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="reg-comuna" class="form-label">Comuna</label>
                            <select class="form-select" id="reg-comuna">
                                <option value="">-- Seleccione la comuna --</option>
                            </select>
                            <div class="error-mensaje" id="error-reg-comuna"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="reg-direccion" maxlength="300">
                        <div class="error-mensaje" id="error-reg-direccion"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Registrar</button>
                </form>

                <p class="text-center mt-3">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ProSetup</p>
    </footer>

    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/regiones.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
