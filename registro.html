<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Crear Cuenta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid px-4">
            <!-- Logo -->
            <a class="navbar-brand" href="index.html">
                <img src="img/logo2.png" alt="ProSetup" width="80" height="45" class="img-fluid" onerror="this.src='https://via.placeholder.com/80x45?text=PROSETUP'">
            </a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>

                <!-- Acciones de Usuario y Carrito -->
                <div class="user-actions" id="user-actions">
                    <a href="login.html" id="link-login">Iniciar Sesión</a>
                    <a href="registro.html" id="link-registro">Registro</a>
                    <span class="usuario-info" id="usuario-info" style="display:none;">
                        Hola, <strong id="usuario-nombre"></strong>
                        <a href="admin-productos.html" id="link-admin" style="display:none;">Admin</a>
                        <a href="#" id="link-logout">Cerrar sesión</a>
                    </span>
                    <a href="carrito.html" class="btn-cart">🛒 (<span id="cart-count">0</span>)</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Formulario de registro -->
    <section class="auth-container">
        <div class="auth-card">
            <h1>Crear Cuenta</h1>
            <p class="auth-subtitulo">Regístrate para comprar y guardar tus pedidos en ProSetup.</p>

            <form id="form-registro" novalidate>
                <div class="mb-3">
                    <label for="reg-nombre">Nombre completo</label>
                    <input type="text" id="reg-nombre" placeholder="Ej: Benjamín Soto">
                    <span class="campo-error" id="error-reg-nombre"></span>
                </div>

                <div class="mb-3">
                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="tucorreo@ejemplo.com">
                    <span class="campo-error" id="error-reg-email"></span>
                </div>

                <div class="mb-3">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres">
                    <span class="campo-error" id="error-reg-password"></span>
                </div>

                <div class="mb-3">
                    <label for="reg-confirmar">Confirmar contraseña</label>
                    <input type="password" id="reg-confirmar" placeholder="Repite tu contraseña">
                    <span class="campo-error" id="error-reg-confirmar"></span>
                </div>

                <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>

            <p class="auth-alterna">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </section>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 PROSETUP - Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
