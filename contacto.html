<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ProSetup</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div id="zona-invitado" class="me-3">
                    <a href="login.html" class="text-white me-2">Iniciar Sesión</a>
                    <a href="registro.html" class="text-white">Registro</a>
                </div>
                <div id="zona-usuario" class="d-none text-white me-3">
                    Hola, <strong id="nombre-usuario"></strong> ·
                    <a href="admin-productos.html" id="link-admin" class="text-white d-none">Admin</a>
                    <a href="#" id="link-logout" class="text-white">Cerrar sesión</a>
                </div>
                <a href="carrito.html" class="btn-cart">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="mx-auto" style="max-width: 500px;">
            <div class="card shadow p-4">
                <h2 class="text-center mb-3">Contáctanos</h2>
                <p class="text-muted text-center">Déjanos tus datos y te contactaremos a la brevedad.</p>

                <form id="form-contacto" novalidate>
                    <div class="mb-3">
                        <label for="c-nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="c-nombre">
                        <div class="error-mensaje" id="error-c-nombre"></div>
                    </div>
                    <div class="mb-3">
                        <label for="c-email" class="form-label">Correo (opcional)</label>
                        <input type="email" class="form-control" id="c-email" placeholder="tucorreo@duoc.cl">
                        <div class="error-mensaje" id="error-c-email"></div>
                    </div>
                    <div class="mb-3">
                        <label for="c-comentario" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="c-comentario" rows="4"></textarea>
                        <div class="error-mensaje" id="error-c-comentario"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ProSetup</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
