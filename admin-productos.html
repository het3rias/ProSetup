<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Administrar Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ProSetup</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div id="zona-invitado" class="me-3">
                    <a href="login.html" class="text-white me-2">Iniciar Sesión</a>
                    <a href="registro.html" class="text-white">Registro</a>
                </div>
                <div id="zona-usuario" class="d-none text-white me-3">
                    Hola, <strong id="nombre-usuario"></strong> ·
                    <a href="admin-productos.html" id="link-admin" class="text-white d-none">Admin</a>
                    <a href="#" id="link-logout" class="text-white">Cerrar sesión</a>
                </div>
                <a href="carrito.html" class="btn-cart">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-4">Administrar Productos</h1>

        <div class="row">
            <!-- Formulario para crear/editar -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 id="titulo-formulario">Agregar Producto</h5>
                    <form id="form-admin-producto">
                        <input type="hidden" id="admin-id">
                        <div class="mb-2">
                            <label for="admin-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="admin-nombre" required>
                        </div>
                        <div class="mb-2">
                            <label for="admin-categoria" class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="admin-categoria" required>
                        </div>
                        <div class="mb-2">
                            <label for="admin-precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="admin-precio" min="0" required>
                        </div>
                        <div class="mb-2">
                            <label for="admin-stock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="admin-stock" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="admin-imagen" class="form-label">Imagen (ruta, opcional)</label>
                            <input type="text" class="form-control" id="admin-imagen" placeholder="img/producto.jpg">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2" id="btn-cancelar-edicion">Cancelar</button>
                    </form>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="col-md-8">
                <table class="table table-bordered bg-white">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ProSetup</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
