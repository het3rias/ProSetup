<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Administrar Productos</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-title">ProSetup Admin</div>
            <nav>
                <a href="admin-home.html" data-pagina="home">🏠 Dashboard</a>
                <a href="admin-productos.html" data-pagina="productos">📦 Productos</a>
                <a href="admin-usuarios.html" data-pagina="usuarios" id="admin-nav-usuarios">👤 Usuarios</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="index.html">🏬 Ver tienda</a>
                <a href="#" id="link-logout-admin">🚪 Cerrar sesión</a>
            </div>
        </aside>

        <div class="admin-content">
            <header class="admin-topbar">
                <h1 class="h3 mb-0">Administrar Productos</h1>
                <span class="badge bg-primary badge-rol">Rol: <span id="admin-rol-badge"></span> · <span id="admin-nombre-usuario"></span></span>
            </header>

            <main>
                <div class="row">
                    <!-- Formulario para crear/editar (oculto para Vendedor mediante .solo-admin) -->
                    <section class="col-lg-4 mb-4 solo-admin">
                        <div class="card p-3">
                            <h2 class="h5" id="titulo-formulario">Nuevo Producto</h2>
                            <form id="form-admin-producto" novalidate>
                                <input type="hidden" id="admin-id">

                                <div class="mb-2">
                                    <label for="admin-codigo" class="form-label">Código de producto</label>
                                    <input type="text" class="form-control" id="admin-codigo" minlength="3">
                                    <div class="error-mensaje" id="error-codigo"></div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="admin-nombre" maxlength="100">
                                    <div class="error-mensaje" id="error-nombre"></div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-descripcion" class="form-label">Descripción (opcional)</label>
                                    <textarea class="form-control" id="admin-descripcion" rows="2" maxlength="500"></textarea>
                                    <div class="error-mensaje" id="error-descripcion"></div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-categoria" class="form-label">Categoría</label>
                                    <select class="form-select" id="admin-categoria"></select>
                                    <div class="error-mensaje" id="error-categoria"></div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-2">
                                        <label for="admin-precio" class="form-label">Precio</label>
                                        <input type="number" class="form-control" id="admin-precio" min="0" step="0.01">
                                        <div class="error-mensaje" id="error-precio"></div>
                                    </div>
                                    <div class="col-6 mb-2">
                                        <label for="admin-stock" class="form-label">Stock</label>
                                        <input type="number" class="form-control" id="admin-stock" min="0" step="1">
                                        <div class="error-mensaje" id="error-stock"></div>
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <label for="admin-stock-critico" class="form-label">Stock crítico (opcional)</label>
                                    <input type="number" class="form-control" id="admin-stock-critico" min="0" step="1">
                                    <div class="form-text">Se mostrará una alerta cuando el stock sea igual o menor a este número.</div>
                                    <div class="error-mensaje" id="error-stock-critico"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="admin-imagen" class="form-label">Imagen (ruta, opcional)</label>
                                    <input type="text" class="form-control" id="admin-imagen" placeholder="img/producto.jpg">
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Guardar</button>
                                <button type="button" class="btn btn-outline-secondary w-100 mt-2" id="btn-cancelar-edicion">Cancelar</button>
                            </form>
                        </div>
                    </section>

                    <!-- Listado de productos -->
                    <section class="col-lg-8">
                        <div class="table-responsive">
                            <table class="table table-bordered bg-white align-middle">
                                <thead>
                                    <tr>
                                        <th>Imagen</th>
                                        <th>Código</th>
                                        <th>Nombre</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-productos"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Mostrar Producto -->
    <div class="modal fade" id="modal-producto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle del producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-producto-contenido"></div>
            </div>
        </div>
    </div>

    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/regiones.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
