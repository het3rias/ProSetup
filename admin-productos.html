<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSetup - Administración de Productos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid px-4">
            <!-- Logo -->
            <a class="navbar-brand" href="index.html">
                <img src="img/logo2.png" alt="ProSetup" width="80" height="45" class="img-fluid" onerror="this.src='https://via.placeholder.com/80x45?text=PROSETUP'">
            </a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>

                <!-- Acciones de Usuario y Carrito -->
                <div class="user-actions">
                    <a href="login.html">Iniciar Sesión</a>
                    <a href="registro.html">Registro</a>
                    <a href="carrito.html" class="btn-cart">🛒 (<span id="cart-count">0</span>)</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Encabezado del panel -->
    <section class="admin-header">
        <div>
            <h1>Administración de Productos</h1>
            <p>Crea, edita o elimina productos del catálogo de ProSetup.</p>
        </div>
        <button type="button" class="btn-nuevo-producto" id="btn-nuevo-producto">+ Agregar Producto</button>
    </section>

    <!-- Tabla de productos -->
    <section class="admin-tabla-wrapper">
        <table class="admin-tabla">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-tabla-productos">
                <!-- Se rellena con renderizarTablaAdmin() en js/productos.js -->
            </tbody>
        </table>
    </section>

    <section class="admin-footer-acciones">
        <button type="button" class="btn-restablecer" id="btn-restablecer-catalogo">Restablecer catálogo por defecto</button>
    </section>

    <!-- Modal Crear/Editar Producto -->
    <div class="modal fade" id="modal-producto" tabindex="-1" aria-labelledby="modal-producto-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="form-producto" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="modal-producto-titulo">Agregar Producto</h2>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="input-id-editando">

                        <div class="mb-3">
                            <label for="input-nombre" class="form-label">Nombre del producto</label>
                            <input type="text" class="form-control" id="input-nombre" placeholder="Ej: Teclado Mecánico RGB">
                            <span class="campo-error" id="error-input-nombre"></span>
                        </div>

                        <div class="mb-3">
                            <label for="input-codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" id="input-codigo" placeholder="Ej: KEY-013">
                            <span class="campo-error" id="error-input-codigo"></span>
                        </div>

                        <div class="mb-3">
                            <label for="input-categoria" class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="input-categoria" list="lista-categorias" placeholder="Ej: Periféricos">
                            <datalist id="lista-categorias"></datalist>
                            <span class="campo-error" id="error-input-categoria"></span>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="input-precio" class="form-label">Precio (CLP)</label>
                                <input type="number" class="form-control" id="input-precio" min="0" step="1" placeholder="Ej: 29990">
                                <span class="campo-error" id="error-input-precio"></span>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="input-stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="input-stock" min="0" step="1" placeholder="Ej: 20">
                                <span class="campo-error" id="error-input-stock"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="input-imagen" class="form-label">Ruta de la imagen (opcional)</label>
                            <input type="text" class="form-control" id="input-imagen" placeholder="Ej: img/teclado.jpg">
                            <span class="campo-error" id="error-input-imagen"></span>
                        </div>

                        <div class="mb-3">
                            <label for="input-descripcion" class="form-label">Descripción (opcional)</label>
                            <textarea class="form-control" id="input-descripcion" rows="3" placeholder="Breve descripción del producto..."></textarea>
                            <span class="campo-error" id="error-input-descripcion"></span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-cancelar-modal" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn-guardar-producto">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 PROSETUP - Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
